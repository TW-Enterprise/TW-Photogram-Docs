name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for PDF Generation
        run: npx puppeteer browsers install chrome

      - name: Test PDF failure handling
        run: pnpm test

      - name: Build site & Export Manual Book PDF
        env:
          DOCS_BASE: "/TW-Photogram-Docs"
          DOCS_SITE: "https://tw-enterprise.github.io"
        run: pnpm run build

      - name: Upload Manual Book PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TW-Photogram-Manual-Book-PDF
          path: dist/TW-Photogram-Manual-Book.pdf
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
